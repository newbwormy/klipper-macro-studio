[package]
name = "klipper-macro-studio"
version = "0.1.6"
description = "Interactive Klipper G-code macro builder and 3D simulator"
authors = ["Klipper Macro Studio"]
edition = "2021"

[lib]
name = "klipper_macro_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
